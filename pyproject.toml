[project]
name = "satisfactory-helper"
version = "0.1.0"
description = "Local outcome-first factory planner for Satisfactory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "satisfactory-mcp[gen,web]",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]
bundle = [
    "pyinstaller>=6.16,<7",
]

[project.scripts]
satisfactory-helper = "satisfactory_helper.main:cli"
satisfactory-helper-mcp = "satisfactory_helper.mcp_wrapper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/server/satisfactory_helper"]

[tool.uv.sources]
satisfactory-mcp = { path = "vendor/SatisfactoryMCP", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: requires the installed game and local save files"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
